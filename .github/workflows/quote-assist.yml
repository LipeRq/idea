# 見積アシスト(apps/quote-assist)の型チェック・リント・単体テスト・ビルド・E2E。
# アプリか、その業務設計・技術設計(docs/manufacturing)が変わったときに動く。
# 外部サービスには接続しない(AI はデモモード、Salesforce はモック。APIキー・CRMの認証情報は渡さない)。
name: quote-assist

on:
  push:
    branches: [main]
    paths:
      - "apps/quote-assist/**"
      - "docs/manufacturing/**"
      - ".github/workflows/quote-assist.yml"
  pull_request:
    paths:
      - "apps/quote-assist/**"
      - "docs/manufacturing/**"
      - ".github/workflows/quote-assist.yml"
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチに続けて push したら、古い実行は止める
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 型チェック・テスト・ビルド・E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/quote-assist
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # デモモードとモックの Salesforce(E2E の起動設定でも同じ値を指定している)
      ANTHROPIC_API_KEY: ""
      AI_PROVIDER: demo
      CRM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node のバージョンは package.json の engines.node
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/quote-assist/package.json
          cache: npm
          cache-dependency-path: apps/quote-assist/package-lock.json

      - name: 依存関係のインストール
        run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: リント
        run: npm run lint

      - name: 単体テスト
        run: npm test

      - name: ビルド
        run: npm run build

      - name: Playwright のバージョンを調べる
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Playwright のブラウザのキャッシュ
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Playwright のブラウザをインストール
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # ブラウザ本体がキャッシュから戻っても、OSのライブラリ(日本語フォントを含む)は毎回入れる
      - name: Playwright のブラウザが使うライブラリをインストール
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # 本番ビルドを Basic 認証つきで起動して確かめる(playwright.config.ts)
      - name: E2Eテスト
        run: npm run test:e2e

      - name: 失敗したE2Eのトレースをアップロード
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: apps/quote-assist/test-results/
          retention-days: 7
          if-no-files-found: ignore
