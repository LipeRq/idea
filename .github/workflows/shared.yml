# 共通の部品(packages/shared)の型チェック・単体テスト。
# 各アプリはこのパッケージを TypeScript のソースのまま取り込むので、アプリ側の確認(diagnosis・inventory-web・quote-assist・inventory の
# ワークフロー)も packages/shared の変更で動く。ここはパッケージ自体のテストだけを行う。外部サービスには接続しない(fetch はモック)。
name: shared

on:
  push:
    branches: [main]
    paths:
      - "packages/shared/**"
      - ".github/workflows/shared.yml"
  pull_request:
    paths:
      - "packages/shared/**"
      - ".github/workflows/shared.yml"
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチに続けて push したら、古い実行は止める
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 型チェック・テスト
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/shared
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # engines.node は ">=22" なので、各アプリと同じ Node 22 に固定する
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/shared/package-lock.json

      - name: 依存関係のインストール
        run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: 単体テスト
        run: npm test
