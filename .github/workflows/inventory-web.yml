# 棚卸しツールの画面(apps/inventory-web)の型チェック・リント・単体テスト・ビルド・E2E。
# 画面アプリは解析エンジン(apps/inventory)を取り込むので、どちらかが変わったときに動く。
# 外部サービスには接続しない(AI 版は E2E でモックの文章を使い、APIキーは渡さない)。
name: inventory-web

on:
  push:
    branches: [main]
    paths:
      - "apps/inventory/**"
      - "apps/inventory-web/**"
      - ".github/workflows/inventory-web.yml"
  pull_request:
    paths:
      - "apps/inventory/**"
      - "apps/inventory-web/**"
      - ".github/workflows/inventory-web.yml"
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチに続けて push したら、古い実行は止める
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 型チェック・テスト・ビルド・E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/inventory-web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # engines.node は ">=22" なので、Node 22 に固定する
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/inventory/package-lock.json
            apps/inventory-web/package-lock.json

      # サーバーの AI ルートと解析 Worker のバンドルが、エンジン(apps/inventory)の依存を使う
      - name: 依存関係のインストール(解析エンジン)
        working-directory: apps/inventory
        run: npm ci

      - name: 依存関係のインストール(画面)
        run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: リント
        run: npm run lint

      - name: 単体テスト
        run: npm test

      - name: ビルド
        run: npm run build

      - name: Playwright のバージョンを調べる
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Playwright のブラウザのキャッシュ
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Playwright のブラウザをインストール
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # ブラウザ本体がキャッシュから戻っても、OSのライブラリ(日本語フォントを含む)は毎回入れる
      - name: Playwright のブラウザが使うライブラリをインストール
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2Eテスト
        run: npm run test:e2e

      - name: 失敗したE2Eのトレースをアップロード
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: apps/inventory-web/test-results/
          retention-days: 7
          if-no-files-found: ignore
